<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- <div class="background"> -->
        <div class="dashboardFrame">
            <div class="dashboardTitleContainer">
                <h3>ADMIN</h3>
                <h1>DASHBOARD</h1> 
            </div>
            <div class="dashboardCategories">
                <h4 id="dashboardTheaters">Theaters</h4>
                <h4 id="dashboardMovies">Movies</h4>
                <h4 id="dashboardScreenings">Screenings</h4>
                <h4 id="dashboardReservations">Reservations</h4>
                <h4 id="dashboardEmployees">Employees</h4>
            </div>
        </div>

        <!-- THEATERS -->
        <div class="adminContentFrame" id="theaterFrame">
            <h1 id="adminContentTitle">THEATERS</h1>
            <div class="adminButtonContainer">
                <button class="adminButton">New Theater</button>
                <button class="adminButton grey">Edit Example Button</button>
                <button class="adminButton delete">Delete Example Button</button>
            </div>
            <div class="adminContent">
                <div class="adminContentTheaterElement">
                    <h2>Main Lounge</h2>
                    <button class="adminButton delete">Delete</button>
                </div>
                <div class="adminContentTheaterElement">
                    <h2>VIP Lounge</h2>
                    <button class="adminButton delete">Delete</button>
                </div>
                <div class="adminContentTheaterElement">
                    <h2>Example 1</h2>
                    <button class="adminButton delete">Delete</button>
                </div>

            </div>
        </div>

        <!-- MOVIES -->
         <div class="adminContentFrame" id="movieFrame">
            <h1 id="adminContentTitle">MOVIES</h1>
             <div class="filter">
                 <input type="text" id="search" placeholder="Search movies...">
             </div>
            <div class="adminButtonContainer">
                <button class="adminButton" id="addMovieBtn">New Movie</button>
                <button class="adminButton grey" id="manageGenres">Manage Genres</button>
                <button class="adminButton grey" id="manageAgeLimits">Manage Age Limits</button>
            </div>
            <div class="movieHandlerBoxContainer">
            </div>
        </div>

        <!-- SCREENINGS -->
         <div class="adminContentFrame" id="screeningsFrame">
            <h1 id="adminContentTitle">SCREENINGS</h1>
            <div class="adminButtonContainer">
                <button class="adminButton" id="adminButtonScreening">New Screening</button>
                
            </div>
            <div class="adminContentScreenings">
                <div class="createScreeningContainer"></div>
                <table class="screeningTable">
                <tr>
                    <th>movie</th>
                    <th>theater</th>
                    <th>date</th>
                    <th>start time</th>
                    <th>price</th>
                    <th>update</th>
                    <th>delete</th>
                </tr>
            </table>

            </div>
        </div>

        <!-- RESERVATIONS -->
         <div class="adminContentFrame" id="reservationsFrame">
            <h1 id="adminContentTitle">RESERVATIONS</h1>
            <div class="adminButtonContainer">
                <button class="adminButton">New Theater</button>
                <button class="adminButton grey">Edit Example Button</button>
                <button class="adminButton delete">Delete Example Button</button>
            </div>
            <div class="adminContent">
                <div class="adminContentTheaterElement">
                    <h2>Main Lounge</h2>
                    <button class="adminButton delete">Delete</button>
                </div>
                <div class="adminContentTheaterElement">
                    <h2>VIP Lounge</h2>
                    <button class="adminButton delete">Delete</button>
                </div>
                <div class="adminContentTheaterElement">
                    <h2>Example 1</h2>
                    <button class="adminButton delete">Delete</button>
                </div>

            </div>
        </div>

        <!-- EMPLOYEES -->
         <div class="adminContentFrame" id="employeeFrame">
            <h1 id="adminContentTitle">EMPLOYEES</h1>
            <div class="adminButtonContainer">
                <button class="adminButton">New Theater</button>
                <button class="adminButton grey">Edit Example Button</button>
                <button class="adminButton delete">Delete Example Button</button>
            </div>
            <div class="adminContent">
                <div class="adminContentTheaterElement">
                    <h2>Main Lounge</h2>
                    <button class="adminButton delete">Delete</button>
                </div>
                <div class="adminContentTheaterElement">
                    <h2>VIP Lounge</h2>
                    <button class="adminButton delete">Delete</button>
                </div>
                <div class="adminContentTheaterElement">
                    <h2>Example 1</h2>
                    <button class="adminButton delete">Delete</button>
                </div>

            </div>
        </div>
    

    <script type="module" src="js/dashboard.js"></script>
    <script type="module" src="js/movieHandler.js"></script>
</body>
</html>
