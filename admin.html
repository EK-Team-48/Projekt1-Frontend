<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="https://kit.fontawesome.com/3277b84a7d.js" crossorigin="anonymous"></script>
    <title>Admin panel</title>
</head>




<div class="login-container">
<form class="login-form">
    
    <h1> welcome to admin panel</h1>
    <label for="username">Username</label>
    <input type="name" name="username" id="username" placeholder="Insert username here">

    <label for="password">Password</label>
    <input type="password" name="password" id="password" placeholder="insert password here">

    <button class="authenticate">Login</button>
</form>
</div>

<body>
<section class="movieHandlerContainer">
    <h1>Our Movies</h1>
    <div class="filter">
        <input type="text" id="search" placeholder="Search movies...">
        <select id="genre">
        </select>
    </div>
    <button class="addMovieBtn" id="addMovieBtn">Add Movie</button>
    <div class="movieHandlerBoxContainer">
    </div>
</section>





<script type="module" src="js/admin.js"></script>
<script type="module" src="js/movieHandler.js"></script>

</body>

</html>
