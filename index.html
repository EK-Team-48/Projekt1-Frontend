<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Kino</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- <header class="gradient-bg">
    <div>
        <h1 class="title">Kino48</h1>
    </div>
</header> -->

    <div class="background">
        <!-- Movie selection -->
        <section class="filmContainer">
            <h1>Choose Movie</h1>
            <div class="filter">
            <input type="text" id="search" placeholder="Search movies...">
            <select id="genre">
  
            </select>
            <select id="rating">
                <option value="">All Ratings</option>
                <option value="PG13">+13</option>
                <option value="PG18">+18</option>
            </select>
        </div>
            <div class="filmBoxContainer">
                
            </div>
        </section>

        <!-- Movie details -->
        <div class="movieDetails" id="movieDetails">
            <div class="movieDetails-content">
                <div id="trailerContainer" class="trailer"></div>
                <h2 id="movieTitle"></h2>
                <h3 id="genres"></h3>
                <p id="movieDescription"></p>
                <button class="book-btn" id="abc">Book</button>
            </div>
        </div>

        <!-- Seat Booking -->
         <div class="seatFrame">
            <div class="seatFrameContent">
                <div class="lærredContainer">
                <div class="lærred"></div>
                <h3>Lærred</h3>
            </div>
            <div class="seatContainer">
                
            </div>
            <div class="ticketinfo">
                <h4 class="tickets">
                    <p>Antal sæder: &nbsp;</p>
                    <p id="tickets"></p>
                </h4>
                <h4 class="price">
                    <p id="price"></p>
                    <p>&nbsp;DKK</p>
                </h4>
            </div>
            <button class="book-btn confirm-btn">Confirm</button>
            </div>
            
         </div>
    </div>

<div class="movieContainer">
</div>

<h1 class="vælgSpilletid">Vælg spilletid</h1>
<div class="screeningBoxContainer">

</div>
</body>
<script type="module" src="js/movies.js"></script>
</html>
