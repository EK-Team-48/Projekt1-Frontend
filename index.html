<body>

    <div class="background">
        <!-- Movie selection -->
        <section class="filmContainer">
            <h1>Choose Movie</h1>
            <div class="filter">
            <input type="text" id="search" placeholder="Search movies...">
            <select id="genre">
  
            </select>
            <select id="rating">
                <option value="">All Ratings</option>
                <option value="PG13">+13</option>
                <option value="PG18">+18</option>
            </select>
        </div>
            <div class="filmBoxContainer">
                
            </div>
        </section>

        <!-- Movie details -->
        <div class="movieDetails" id="movieDetails">
            <div class="movieDetails-content">
                <div id="trailerContainer" class="trailer"></div>
                <h2 id="movieTitle"></h2>
                <h3 id="genres"></h3>
                <p id="movieDescription"></p>
                <button class="book-btn" id="book-btn">Book</button>
            </div>
        </div>

        <!-- Seat Booking -->
         <div class="seatFrame">
            <div class="seatFrameContent">
                <div class="lærredContainer">
                <div class="lærred"></div>
                <h3>Canvas</h3>
            </div>
            <div class="seatContainer">
                
            </div>
            <div class="ticketinfo">
                <h4 class="tickets">
                    <p>Number of seats: &nbsp;</p>
                    <p id="tickets"></p>
                </h4>
                <h4 class="price">
                    <p id="price"></p>
                    <p>&nbsp;DKK</p>
                </h4>
            </div>
            <button class="book-btn confirm-btn">Confirm</button>
            </div>
            
         </div>
         <div class="checkoutFrame">
    <div class="checkout-box" id="checkoutBox">
        <form class="checkout-form">
            <h1>Checkout</h1>

            <div class="form-section">
                <h2>Billing Address</h2>
                <div class="grid-2">
                    <div class="input-box">
                        <label for="firstName">First name</label>
                        <input type="text" name="firstName" id="firstName" placeholder="Insert First name" required>
                    </div>
                    <div class="input-box">
                        <label for="lastName">Last name</label>
                        <input type="text" name="lastName" id="lastName" placeholder="Insert Last name" required>
                    </div>
                </div>

                <div class="input-box">
                    <label for="number">Number</label>
                    <input type="number" name="number" id="number"placeholder="Insert your number" required>
                </div>

                <div class="input-box">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Insert your email" required>
                </div>

                <div class="input-box">
                    <label for="age"> Age </label>
                    <input type="date" name="age" id="age" required>
                </div>

                <div class="input-box">
                    <label for="address">Address</label>
                    <input type="text" id="address" name="address" placeholder="Street and number" required>
                </div>

                <div class="grid-2">
                    <div class="input-box">
                        <label for="city">City</label>
                        <input type="text" name="city" placeholder="City" required>
                    </div>
                    <div class="input-box">
                        <label for="zip">Zip</label>
                        <input type="text" name="zip" placeholder="Zip" required>
                    </div>
                </div>
            </div>

            <div class="submit-box">
                <button class="confirm-order" type="submit">Continue to checkout</button>
            </div>
        </form>
    </div>
    </div>


<div class="movieContainer">
</div>
         <!-- time selection -->
        
         <div class="timeSelectionFrame">
            <div class="timeSelectionFrameContent">
                <div class="movieContainer"></div>
                
                <div class="timeColumnContainer">

                    </div> -->
